<header class="container-fluid py-3 py-xl-4">
    <div class="container-lg d-flex justify-content-between align-items-center">
        <div id="logo">
            <a href="{{ 'homepage'|page }}">
                <img src="{{ 'assets/images/logo.svg'|theme }}" alt="logo">
            </a>
        </div>

        <div id="menu" class="d-none d-xxl-flex">
            {% component "menu" %}

            {% set activeFlag = this.site.code == 'en' ? 'uk' : this.site.code %}

            <ul class="nav nav-pills langs">
                <li class="nav-item position-relative">
                    <span class="nav-link text-primary pe-0" title="{{ this.site.name }}" aria-label="{{ this.site.name }}" style="cursor: pointer; display: inline-flex; align-items: center; gap: .5rem;">
                        <img src="{{ ('assets/images/flags/' ~ activeFlag ~ '.svg')|theme }}" alt="" style="display: block; width: 28px; height: 20px; object-fit: cover; border-radius: 2px; box-shadow: 0 0 0 1px rgba(64, 64, 68, .15);">
                        <span class="visually-hidden">{{ this.site.name }}</span>
                        <i class="bi bi-caret-down-fill" style="font-size: .75rem;"></i>
                    </span>

                    <div class="position-absolute overflow-hidden" style="min-width: 44px;">
                        {% partial "langs/default" %}
                    </div>
                </li>
            </ul>
        </div>

        <div id="menu-toggle" class="d-xxl-none">
            <a href="#offcanvas" class="text-body lh-1" data-bs-toggle="offcanvas">
                <i class="bi bi-list fs-55"></i>
            </a>
        </div>
    </div>
</header>
