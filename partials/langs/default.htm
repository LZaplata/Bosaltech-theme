<ul class="nav flex-column">
    {% for site in sitepicker.sites %}
        {% if site.code != this.site.code %}
            {% set siteFlag = site.code == 'en' ? 'uk' : site.code %}
            <li class="nav-item">
                <a href="{{ site.url }}" class="nav-link py-1" title="{{ site.name }}" aria-label="{{ site.name }}" style="display: flex; align-items: center; justify-content: center;">
                    <img src="{{ ('assets/images/flags/' ~ siteFlag ~ '.svg')|theme }}" alt="" style="display: block; width: 28px; height: 20px; object-fit: cover; border-radius: 2px; box-shadow: 0 0 0 1px rgba(64, 64, 68, .15);">
                    <span class="visually-hidden">{{ site.name }}</span>
                </a>
            </li>
        {% endif %}
    {% endfor %}
</ul>
