<ul class="nav flex-column">
    {% for site in sitepicker.sites %}
        {% set siteFlag = site.code == 'en' ? 'uk' : site.code %}
        <li class="nav-item">
            <a href="{{ site.url }}" class="nav-link fs-17 text-center {{ site.code == this.site.code ? 'text-secondary' : 'text-white' }}" title="{{ site.name }}" aria-label="{{ site.name }}" style="display: inline-flex; align-items: center; justify-content: center; padding-top: .5rem; padding-bottom: .5rem;">
                <img src="{{ ('assets/images/flags/' ~ siteFlag ~ '.svg')|theme }}" alt="" style="display: block; width: 32px; height: 22px; object-fit: cover; border-radius: 2px; box-shadow: {{ site.code == this.site.code ? '0 0 0 2px #f17920' : '0 0 0 1px rgba(64, 64, 68, .15)' }};">
                <span class="visually-hidden">{{ site.name }}</span>
            </a>
        </li>
    {% endfor %}
</ul>
